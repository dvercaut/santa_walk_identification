# Publiceert docs/ automatisch naar Firebase Hosting bij elke push naar master
# (en voorlopig ook update-2026). Zonder sleutels: GitHub krijgt via Workload
# Identity Federation tijdelijk de rechten van github-deploy@… (enkel Hosting),
# en enkel vanuit de repo dvercaut/santa_walk_identification.
name: Deploy naar Firebase Hosting

on:
  push:
    branches: [master, update-2026]
    paths: ['docs/**', 'firebase.json', '.github/workflows/firebase-hosting.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/335975652977/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@santa-walk-identification.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: npx --yes firebase-tools@15 deploy --only hosting --project santa-walk-identification --non-interactive
