<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b71c1c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com">
  <title>Santa Walk – Scanner</title>
  <link rel="icon" type="image/png" href="santa_claus.png">
  <link rel="apple-touch-icon" href="santa_claus.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="santa_claus.png" alt=""><span id="title">Santa Walk</span></div>
    <div class="status">
      <span id="countBadge" class="badge" title="Totaal gescand">–</span>
      <span id="netDot" class="dot" title="Verbinding"></span>
    </div>
  </header>
  <div id="demoBanner" class="demo" hidden>OEFENMODUS – scans worden niet opgeslagen</div>

  <!-- Login -->
  <section id="loginView" class="view" hidden>
    <form id="loginForm" class="card">
      <h2>Aanmelden</h2>
      <label>E-mail <input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>Wachtwoord <input id="loginPw" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Aanmelden</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </section>

  <main id="mainView" hidden>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="scan" role="tab">Scannen</button>
      <button class="tab" data-tab="count" role="tab">Teller</button>
      <button class="tab" data-tab="settings" role="tab">Instellingen</button>
    </nav>

    <!-- Scannen -->
    <section id="tab-scan" class="view">
      <div class="camera">
        <video id="video" playsinline muted autoplay></video>
        <div class="frame" aria-hidden="true"></div>
        <div id="result" class="result" hidden>
          <div id="resultTitle" class="result-title"></div>
          <div id="resultDetail" class="result-detail"></div>
        </div>
        <button id="startBtn" class="start primary">📷 Start camera</button>
        <p id="camError" class="cam-error" role="alert" hidden></p>
      </div>

      <div class="controls">
        <button id="torchBtn" hidden>🔦 Lamp</button>
        <select id="cameraSelect" aria-label="Camera kiezen" hidden></select>
        <label id="zoomWrap" class="zoom" hidden>Zoom <input id="zoom" type="range"></label>
        <button id="stopBtn" hidden>Stop</button>
      </div>

      <form id="manualForm" class="manual">
        <input id="manualInput" inputmode="numeric" placeholder="Nummer manueel ingeven" aria-label="Bandjesnummer">
        <button type="submit">OK</button>
      </form>

      <h3 class="recent-title">Laatste scans op dit toestel</h3>
      <ul id="recent" class="recent"><li class="empty">Nog geen scans</li></ul>
    </section>

    <!-- Teller -->
    <section id="tab-count" class="view" hidden>
      <div class="card center">
        <div class="label">Deelnemers <span id="yearLabel"></span></div>
        <div id="totalCount" class="big">–</div>
        <div id="syncInfo" class="muted"></div>
      </div>
      <div class="card">
        <h3>Per scanner</h3>
        <table id="perScanner"><tbody></tbody></table>
      </div>
      <div class="card">
        <h3>Per kwartier</h3>
        <div id="timeline" class="timeline"></div>
      </div>
      <button id="exportBtn">⬇️ Exporteer CSV</button>
    </section>

    <!-- Instellingen -->
    <section id="tab-settings" class="view" hidden>
      <div class="card">
        <label>Naam van deze scanner (bv. "Ingang 1")
          <input id="scannerName" maxlength="30">
        </label>
        <label class="row"><input id="soundToggle" type="checkbox"> Geluid bij scan</label>
        <label class="row"><input id="vibrateToggle" type="checkbox"> Trillen bij scan</label>
      </div>
      <div class="card muted small">
        <div>Collectie: <code id="infoCollection"></code></div>
        <div>Verwachte code: <code id="infoPrefix"></code></div>
        <div>Scan-engine: <span id="infoEngine">nog niet gestart</span></div>
        <div>Aangemeld als: <span id="infoUser">–</span></div>
      </div>
      <button id="logoutBtn">Afmelden</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
